<!doctype html>
<html lang="en">
    <head>
        <!-- Metadata Stuff-->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>welcome!</title>
        <!-- Link to styles-->
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="canvas/modal-canvas.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Cinzel&display=swap"
            rel="stylesheet"
        />
        <script defer src="app.js"></script>
        <script defer src="canvas/modal-canvas.iife.js"></script>
        <script defer src="modal-canvas.js"></script>
    </head>

    <body>
        <section>
            <h1 id="time"></h1>
        </section>

        <section>
            <a href="#" class="waste-time-card" id="wasteTimeBtn">
                <span class="waste-time-card-content waste-time-card-quote">
                    <span class="waste-time-card-quote-text">the time you enjoy wasting is not wasted time.</span>
                    <span class="waste-time-card-attribution">- Marthe Troly-Curtin</span>
                </span>
                <span class="waste-time-card-content waste-time-card-invitation">
                    <span>anybody wanna waste some time?</span>
                </span>
            </a>
        </section>

        <div class="modal" id="wasteTimeModal" aria-hidden="true">
            <button class="modal-close" id="modalClose" aria-label="Close">
                ✕
            </button>
            <div class="infinite-canvas-host" id="infiniteCanvasHost"></div>
        </div>

        <footer class="footer">
            <div class="footer-upper">
                <nav
                    class="footer-socials"
                    id="footerSocials"
                    aria-label="Social links"
                ></nav>
                <div class="footer-taglines">
                    <p>no man is a failure who has friends.</p>
                    <p>let's connect!</p>
                </div>
            </div>
            <div class="footer-wordmark" aria-hidden="true">
                <span class="footer-wordmark-text">Jerry Zhu</span>
            </div>
        </footer>
    </body>
</html>
